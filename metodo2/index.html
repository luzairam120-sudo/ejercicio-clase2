<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaludPlus - Resultados médicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light p-3">
    <div class="container bg-white shadow rounded p-4 my-4">
        <div class="d-flex justify-content-between align-items-center
                    flex-wrap gap-2 border-bottom pb-3 mb-4">
            <h2 class="h2 display-md-4 fw-bolder text-primary">
                Centro Médico SaludPlus
            </h2>
            <p class="fw-light text-secondary mb-0">
                Fecha: 15/Oct/2026
            </p>
        </div>
        <h3 class="h4 fw-bold text-capitalize">
            resultados del laboratorio clínico
        </h3>
        <hr>
        <h4 class="h5 fw-bold text-success text-uppercase">
            Paciente: Carlos Eduardo Mendoza
        </h4>
        <p class="fw-medium">
            Estado del examen:
            <span class="fw-bolder text-success text-lowercase">
                completado y firmado
            </span>
        </p>
        <div class="alert alert-info mt-4" role="alert">
            Por favor, descargue el archivo PDF adjunto con su firma electrónica.
        </div>
        <button class="btn btn-primary">
            Descargar resultados PDF
        </button>
    </div>
</body>
</html>
